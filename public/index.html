<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPS Tracker - Pracownik</title>
    <!-- Biblioteka Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Biblioteka Socket.io z CDN -->
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 40px; background: #222; color: white; }
        button { padding: 15px 30px; font-size: 18px; background: #28a745; color: white; border: none; border-radius: 8px; cursor: pointer; }
        button.stop { background: #dc3545; }
        #status { margin-top: 20px; font-size: 16px; color: #aaa; }
    </style>
</head>
<body>

    <h2>Panel Pracownika</h2>
    <p>Wciśnij start, aby udostępniać lokalizację na żywo oraz zarejestrować czas i trasę pracy.</p>
    
    <br>
    <input type="text" id="workerName" placeholder="Twoje imię (np. Jan Kowalski)" style="padding: 10px; width: 80%; max-width: 300px; margin-bottom: 15px;"><br>
    
    <button id="toggleBtn" onclick="toggleTracking()">Rozpocznij jazdę</button>
    <div id="status">Status: Zatrzymany</div>

    <script>
        // --- 1. ZMIENNE GLOBALNE ---
        let watchId = null;
        let wakeLock = null;
        let lastLat = null;
        let lastLng = null;
        let przebytyDystansKm = 0;
        let wejscieZapisane = false;

        // --- 2. INICJALIZACJA SOCKET.IO ORAZ SUPABASE ---
        const socket = io("https://gps-interfach.onrender.com");

        const SUPABASE_URL = 'https://qgemvebcaxntuzqfvvbf.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_PU8SsnsfMB7D7joLixO1Gw_GG0I3KwT';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Obliczanie odległości w km (Haversine)
        function obliczDystans(lat1, lon1, lat2, lon2) {
            const R = 6371; 
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = 
                Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
                Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }

        // Zapis do bazy Supabase
        async function zapiszWbazie(typAkcji) {
            const nameInput = document.getElementById('workerName').value.trim() || "Anonim";
            const dystansDoZapisu = (typAkcji === "Wejście") ? 0 : parseFloat(przebytyDystansKm.toFixed(2));

            const { error } = await supabaseClient
                .from('attendance')
                .insert([
                    { 
                        imie_nazwisko: nameInput, 
                        typ: typAkcji, 
                        kilometry: dystansDoZapisu,
                        szerokosc: lastLat, 
                        dlugosc: lastLng 
                    }
                ]);

            if (error) {
                console.error("Błąd Supabase:", error);
            } else {
                console.log(`Supabase: Zapisano ${typAkcji} (${dystansDoZapisu} km)`);
            }
        }

        // Transmisja pozycji przez HTTP POST (odporna na rozłączanie w tle)
        async function wyslijNaZywo(imie, lat, lng) {
    if (!imie || !lat || !lng) {
        console.error("Brak danych do wysyłki:", { imie, lat, lng });
        return;
    }
    try {
        const res = await fetch('https://gps-interfach.onrender.com/api/location', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                name: imie,
                lat: lat,
                lng: lng
            })
        });

        const data = await res.json();
        if (res.ok) {
            console.log("Pozycja przesłana pomyślnie przez HTTP:", data);
        } else {
            console.error("Powód błędu z serwera:", data.error);
        }
    } catch (err) {
        console.error("Błąd połączenia HTTP:", err);
    }
}
        async function requestWakeLock() {
    if ('wakeLock' in navigator) {
        try {
            wakeLock = await navigator.wakeLock.request('screen');
        } catch (err) { console.error(err); }
    }
}

function releaseWakeLock() {
    if (wakeLock !== null) {
        wakeLock.release().then(() => { wakeLock = null; });
    }
}

        async function toggleTracking() {
            const btn = document.getElementById('toggleBtn');
            const statusDiv = document.getElementById('status');
            const workerName = document.getElementById('workerName').value.trim();

            if (watchId === null) {
                if (!workerName) {
                    alert("Wpisz swoje imię przed rozpoczęciem!");
                    return;
                }

                if (!navigator.geolocation) {
                    alert("Twoja przeglądarka nie obsługuje GPS!");
                    return;
                }

                przebytyDystansKm = 0;
                lastLat = null;
                lastLng = null;

                btn.textContent = "Zatrzymaj trasę";
                btn.className = "stop";
                statusDiv.textContent = "Szukanie sygnału GPS...";

                await requestWakeLock();

                watchId = navigator.geolocation.watchPosition(
                    async (position) => {
                        const newLat = position.coords.latitude;
                        const newLng = position.coords.longitude;
                        
                        if (lastLat !== null && lastLng !== null) {
                            const d = obliczDystans(lastLat, lastLng, newLat, newLng);
                            if (d > 0.003) {
                                przebytyDystansKm += d;
                            }
                        }

                        lastLat = newLat;
                        lastLng = newLng;
                        
                        statusDiv.innerHTML = `Status: W trasie<br>Przebyty dystans: <b>${przebytyDystansKm.toFixed(2)} km</b><br>Szer: ${lastLat.toFixed(4)}, Dł: ${lastLng.toFixed(4)}`;

                        wyslijNaZywo(workerName, lastLat, lastLng);

                        if (watchId && !wejscieZapisane) {
                            wejscieZapisane = true;
                            await zapiszWbazie("Wejście");
                        }
                    },
                    (error) => {
                        alert("Błąd GPS: " + error.message);
                        stopTracking();
                    },
                    { enableHighAccuracy: true, maximumAge: 0, timeout: 10000 }
                );
            } else {
                stopTracking();
            }
        }

        async function stopTracking() {
            if (watchId !== null) {
                navigator.geolocation.clearWatch(watchId);
                watchId = null;
            }

            releaseWakeLock();

            const statusDiv = document.getElementById('status');

            if (wejscieZapisane) {
                await zapiszWbazie("Wyjście");
                wejscieZapisane = false;
                statusDiv.textContent = `Status: Zatrzymany (Zapisano Wyjście, dystans: ${przebytyDystansKm.toFixed(2)} km)`;
            } else {
                statusDiv.textContent = "Status: Zatrzymany";
            }

            document.getElementById('toggleBtn').textContent = "Rozpocznij jazdę";
            document.getElementById('toggleBtn').className = "";
        }
    </script>
</body>
</html>
